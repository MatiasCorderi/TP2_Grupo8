        </div>

    <main class="contenedor-principal">
        <h1 class="titulo-seccion">Formulario de Contacto</h1>

        <div id="alerta-error" class="alerta-error oculta"></div>
        <div id="alerta-exito" class="alerta-exito oculta">¡El mensaje ha sido enviado correctamente!</div>

        <form id="formulario-contacto" class="formulario-caja" onsubmit="validarFormulario(event)">
            
            <div class="campo-grupo">
                <label for="campo-nombre" class="campo-etiqueta">Nombre Completo *</label>
                <input type="text" id="campo-nombre" class="campo-entrada" placeholder="Ingresa tu nombre">
            </div>

            <div class="campo-grupo">
                <label for="campo-correo" class="campo-etiqueta">Correo Electrónico *</label>
                <input type="text" id="campo-correo" class="campo-entrada" placeholder="ejemplo@correo.com">
            </div>

            <div class="campo-grupo">
                <label for="campo-asunto" class="campo-etiqueta">Asunto *</label>
                <input type="text" id="campo-asunto" class="campo-entrada" placeholder="Motivo de contacto">
            </div>

            <div class="campo-grupo">
                <label for="campo-mensaje" class="campo-etiqueta">Mensaje (Mínimo 10 caracteres) *</label>
                <textarea id="campo-mensaje" class="campo-entrada" rows="5" placeholder="Escribe tu mensaje..."></textarea>
            </div>

            <button type="submit" class="boton-enviar boton-destacado" style="width: 100%;">Enviar Consulta</button>
        </form>
    </main>

    <footer class="pie-pagina">
        <p>2026 - Proyecto Académico Helmut Ditsch</p>
    </footer>

    <script src="js/script.js"></script>
